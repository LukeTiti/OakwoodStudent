<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oakwood Advisor Bridge</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 380px; padding: 14px; color: #1c1c1e; }
    h1 { font-size: 14px; margin-bottom: 10px; }
    label { font-size: 12px; color: #636366; display: block; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px; border: 1px solid #d1d1d6; border-radius: 8px; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; font-size: 14px; font-weight: 600; background: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { font-size: 12px; margin: 8px 0; color: #636366; }
    #status.error { color: #ff3b30; }
    #status.ok { color: #1a7f37; }
    pre { max-height: 260px; overflow: auto; background: #f2f2f7; border-radius: 8px; padding: 10px; font-size: 11px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>Pull Volunteer Hours (test)</h1>
  <label for="personPK">Student Veracross Person PK</label>
  <input type="text" id="personPK" placeholder="e.g. 39950" inputmode="numeric" />
  <button id="pullBtn">Pull from Veracross</button>
  <div id="status"></div>
  <pre id="output"></pre>
  <script src="popup.js"></script>
</body>
</html>
